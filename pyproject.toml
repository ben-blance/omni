[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-compress"
version = "0.1.3"
description = "OMNI — install-and-go neural compression for source code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://github.com/ben-blance/omni"
Repository = "https://github.com/ben-blance/omni"

[project.scripts]
omni = "omni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
