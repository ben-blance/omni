[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicli"
version = "0.1.0"
description = "OMNI — install-and-go neural compression for source code"
readme = "README.md"
requires-python = ">=3.10"
# License: TBD before first public release — see README's "Public vs
# private" section. Don't publish this package with a license declared
# until that decision is made.

[project.scripts]
omni = "omni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
